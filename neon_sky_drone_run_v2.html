<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON SKY</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040c;font-family:Arial,sans-serif}
body{touch-action:none}
canvas{display:block;width:100%;height:100%}

#hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;gap:8px;flex-wrap:wrap}
.box{padding:8px 13px;border:1px solid #00eaff55;border-radius:13px;background:#030a18cc}
.small{font-size:10px;letter-spacing:2px;color:#73eaff}
.num{font-size:24px;font-weight:800;color:white}
#coin-indicator{border-color:#ffd60055}
#coin-indicator .num{color:#ffd600;text-shadow:0 0 10px #ffd60088}

#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0009;backdrop-filter:blur(2px)}
.card{width:min(480px,calc(100% - 30px));max-height:92vh;overflow-y:auto;padding:26px 22px;text-align:center;border-radius:24px;background:#050b1de8;border:1px solid #00eaff66;box-shadow:0 0 60px #00eaff22}
.card::-webkit-scrollbar{width:6px}
.card::-webkit-scrollbar-thumb{background:#00eaff55;border-radius:6px}
.card h1{margin:0 0 4px;font-size:44px;letter-spacing:4px;text-shadow:0 0 20px #00eaff}
.card h2.shopTitle{margin:4px 0 6px;font-size:20px;letter-spacing:3px;color:#8fe9ff;text-shadow:0 0 14px #00eaff88}
.card p{color:#a8bad0;margin:0 0 20px}
.card button#start{border:0;border-radius:14px;padding:14px 24px;font-size:17px;font-weight:800;background:linear-gradient(90deg,#00eaff,#8b7cff);color:#02101a;width:100%;cursor:pointer;transition:transform .15s,box-shadow .25s;box-shadow:0 0 22px #00eaff44}
.card button#start:hover{transform:translateY(-2px);box-shadow:0 0 32px #00eaff88}
.card button#start:active{transform:scale(.97)}
.hint{margin-top:15px;color:#7188a4;font-size:12px;line-height:1.6}
.hidden{display:none!important}

/* ───────────── Вкладки ───────────── */
.tabs{display:flex;gap:5px;margin-bottom:20px}
.tab-btn{flex:1;padding:11px 2px;border-radius:12px;border:1px solid #00eaff33;background:#0a1526;color:#8fe9ff;font-weight:800;letter-spacing:.5px;font-size:10px;cursor:pointer;transition:all .25s ease}
.tab-btn:hover{border-color:#00eaff88;color:#c9f8ff}
.tab-btn.active{background:linear-gradient(90deg,#00eaff,#8b7cff);color:#02101a;box-shadow:0 0 18px #00eaff77;border-color:transparent}

.panel{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ───────────── Баланс Coins ───────────── */
.coinBalance{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:14px;background:#151006;border:1px solid #ffd60055;color:#ffd600;font-weight:800;font-size:15px;margin-bottom:18px;box-shadow:0 0 18px #ffd60022}
.coinIcon{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffd600 55%,#c99700);box-shadow:0 0 8px #ffd600}

/* ───────────── Магазин цветов ───────────── */
.colorGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
.colorCard{position:relative;padding:16px 6px 12px;border-radius:16px;border:1.5px solid #ffffff1a;background:#0b1830;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease}
.colorCard:hover{transform:translateY(-4px);border-color:#00eaff88}
.colorCard:active{transform:scale(.94)}
.colorCard.selected{border-color:#ffffffcc;box-shadow:0 0 24px var(--glow,#00eaff),inset 0 0 12px #ffffff11}
.colorCard.locked{opacity:.85}
.colorCard.shakeErr{animation:shakeErr .35s}
@keyframes shakeErr{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.planeIcon{width:42px;height:24px;background:var(--top,#fff);box-shadow:0 0 16px var(--glow,#00eaff);clip-path:polygon(100% 50%,22% 4%,40% 42%,0% 48%,40% 58%,22% 96%);transition:box-shadow .25s}
.colorCard.selected .planeIcon{box-shadow:0 0 26px var(--glow,#00eaff),0 0 6px #fff}
.colorCard.locked .planeIcon{filter:grayscale(.35) brightness(.75)}
.colorCard .name,.tailCard .name,.bgCard .name{font-size:11px;color:#cfe9ff;letter-spacing:.5px;font-weight:700}
.price{font-size:11px;font-weight:800;color:#ffd600;text-shadow:0 0 8px #ffd60077;display:flex;align-items:center;gap:4px}
.price .coinIcon{width:11px;height:11px}
.check{position:absolute;top:6px;right:9px;font-size:13px;color:#7effa0;opacity:0;transform:scale(.5);transition:all .2s ease;text-shadow:0 0 8px #7effa0}
.selected .check{opacity:1;transform:scale(1)}
.lockIcon{position:absolute;top:6px;right:9px;font-size:11px;opacity:.6}

/* ───────────── Магазин хвостов ───────────── */
.tailGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:4px}
.tailCard{position:relative;min-height:130px;padding:16px 8px 12px;border-radius:16px;border:1.5px solid #ffffff1a;background:#0b1830;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease}
.tailCard:hover{transform:translateY(-4px);border-color:var(--tail-color,#00eaff)}
.tailCard:active{transform:scale(.95)}
.tailCard.selected{border-color:var(--tail-color,#00eaff);box-shadow:0 0 24px var(--tail-color,#00eaff),inset 0 0 12px #ffffff11}
.tailCard.locked{opacity:.85}
.tailPreview{position:relative;width:92px;height:32px}
.tailPreviewPlane{position:absolute;right:2px;top:9px;width:35px;height:18px;background:var(--tail-color,#f4ffff);clip-path:polygon(100% 50%,22% 4%,40% 42%,0% 48%,40% 58%,22% 96%);filter:drop-shadow(0 0 7px var(--tail-color,#00eaff))}
.tailPreviewLine{position:absolute;left:0;top:15px;width:65px;height:7px;border-radius:50%;background:linear-gradient(90deg,transparent,var(--tail-color,#00eaff));box-shadow:0 0 12px var(--tail-color,#00eaff);opacity:.9}

/* ───────────── Магазин фонов ───────────── */
.bgGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:4px}
.bgCard{position:relative;padding:10px 9px 11px;border-radius:16px;border:1.5px solid #ffffff1a;background:#0b1830;display:flex;flex-direction:column;align-items:center;gap:9px;transition:transform .18s ease,box-shadow .25s ease,border-color .25s ease}
.bgCard:hover{transform:translateY(-4px);border-color:#00eaff88}
.bgCard.selected{border-color:#00eaffcc;box-shadow:0 0 24px #00eaff55,inset 0 0 12px #ffffff11}
.bgCard.locked{opacity:.92}
.bgCard.shakeErr{animation:shakeErr .35s}
.bgPreview{width:100%;height:66px;border-radius:11px;border:1px solid #ffffff14;box-shadow:inset 0 0 18px #00000066}
.bgCard .name{min-height:26px;display:flex;align-items:center;line-height:1.25}
.bgBtn{width:100%;border:0;border-radius
