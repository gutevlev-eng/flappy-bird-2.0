<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON SKY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040c;font-family:Arial,sans-serif}body{touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;gap:8px;flex-wrap:wrap}
.box{padding:8px 13px;border:1px solid #00eaff55;border-radius:13px;background:#030a18cc}.small{font-size:10px;letter-spacing:2px;color:#73eaff}.num{font-size:24px;font-weight:800;color:white}
#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#0009}.card{width:min(420px,calc(100% - 30px));padding:30px 24px;text-align:center;border-radius:24px;background:#050b1de8;border:1px solid #00eaff66;box-shadow:0 0 60px #00eaff22}.card h1{margin:0 0 8px;font-size:46px;letter-spacing:4px;text-shadow:0 0 20px #00eaff}.card p{color:#a8bad0;margin:0 0 23px}.card button{border:0;border-radius:14px;padding:14px 24px;font-size:17px;font-weight:800;background:linear-gradient(90deg,#00eaff,#8b7cff);color:#02101a}.hint{margin-top:15px;color:#7188a4;font-size:12px}.hidden{display:none!important}
#barrel-indicator .num{color:#ffbc4a}
#speed-indicator .num{color:#7eff8b}
#boost-indicator .num{color:#00eaff}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="box"><div class="small">SCORE</div><div class="num" id="score">0</div></div>
 <div class="box" id="speed-indicator"><div class="small">СКОРОСТЬ</div><div class="num" id="speedLvl">×1.00</div></div>
 <div class="box" id="boost-indicator"><div class="small">БУСТ</div><div class="num" id="boostLvl">—</div></div>
 <div class="box" id="barrel-indicator"><div class="small">БОЧКА</div><div class="num" id="barrelCount">0/10</div></div>
 <div class="box"><div class="small">BEST</div><div class="num" id="best">0</div></div>
</div>
<div id="overlay"><div class="card">
 <h1 id="title">NEON SKY</h1><p id="subtitle">DRONE RUN</p>
 <button id="start">Взлететь ✈️</button>
 <div class="hint">Тап / клик / Space — вверх<br>Без нажатий — самолёт падает<br>10 кликов = бочка (неуязвимость 3с)<br>Каждые 10 очков = +10% скорости<br>Голубой кристалл (~раз в 30 очков) = +10 очков и ускорение 3с</div>
</div></div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
const overlay=document.getElementById("overlay"),start=document.getElementById("start");
const title=document.getElementById("title"),subtitle=document.getElementById("subtitle");
const barrelCountEl=document.getElementById("barrelCount");
const speedLvlEl=document.getElementById("speedLvl");
const boostLvlEl=document.getElementById("boostLvl");

let W,H,DPR=1,last=0,time=0,playing=false,score=0,best=+localStorage.neonSkyBest||0,spawn=0,shake=0;
bestEl.textContent=best;

/* ── Скорость дронов: +10% каждые 10 очков (сложный процент) ── */
let speedMultiplier=1.0;       // 1.0 = базовая скорость
let lastSpeedTier=0;           // последний «порог», при котором обновляли множитель

function updateSpeedMultiplier(){
 const tier=Math.floor(score/10);           // каждые 10 очков — новый тир
 if(tier>lastSpeedTier){
  speedMultiplier=Math.pow(1.10,tier);      // сложный процент: 1.1^tier
  lastSpeedTier=tier;
  speedLvlEl.textContent="×"+speedMultiplier.toFixed(2);
 }
}

/* ── Бочка ── */
const barrelRoll={
 active:false,
 timer:0,
 duration:3,
 clicks:0,
 needed:10,
 rollAngle:0,
 rollSpeed:0
};

function resetBarrel(){
 barrelRoll.active=false;barrelRoll.timer=0;
 barrelRoll.clicks=0;barrelRoll.rollAngle=0;barrelRoll.rollSpeed=0;
 barrelCountEl.textContent="0/10";
}

function updateBarrelHUD(){
 if(barrelRoll.active){
  barrelCountEl.textContent="АКТИВ!";
 }else{
  barrelCountEl.textContent=barrelRoll.clicks+"/"+barrelRoll.needed;
 }
}

/* ── Буст-кристалл (голубой светящийся шар) ── */
let boostOrb=null;                 // {x,y,r,vx}
let boostThreshold=randomBoostGap(30); // следующий порог очков для спавна
const playerBoost={active:false,timer:0,duration:3,elapsed:0,mult:1.6};
let globalSpeedFX=1; // множитель скорости фона/звёзд во время буста

function randomBoostGap(base){
 return base+Math.floor(Math.random()*11-5); // base ± 5, разброс по очкам
}

function getBoostFactor(){
 if(!playerBoost.active)return 1;
 const rampIn=0.3,fadeOut=0.6;
 const{elapsed,timer,mult}=playerBoost;
 if(elapsed<rampIn)return 1+(mult-1)*(elapsed/rampIn);
 if(timer<fadeOut)return 1+(mult-1)*(timer/fadeOut);
 return mult;
}

function findSafeBoostY(){
 let bestY=H/2,bestGap=-1;
 for(let i=0;i<25;i++){
  const y=90+Math.random()*(H-180); // случайная позиция по вертикали
  let minDist=Infinity;
  for(const d of drones)minDist=Math.min(minDist,Math.abs(y-d.y));
  if(minDist>bestGap){bestGap=minDist;bestY=y;}
  if(minDist>140)return y;
 }
 return bestY;
}

function spawnBoost(){
 boostOrb={x:W+90,y:findSafeBoostY(),r:32,vx:255};
}

function updateBoostOrb(dt){
 if(!boostOrb)return;
 boostOrb.x-=boostOrb.vx*dt;

 /* избегание дронов в полёте, чтобы не соприкасаться */
 for(const d of drones){
  const dx=boostOrb.x-d.x,dy=boostOrb.y-d.y;
  const dist=Math.hypot(dx,dy);
  const safe=95;
  if(dist<safe&&dist>0.001){
   boostOrb.y+=(dy/dist)*((safe-dist)/safe)*220*dt;
  }
 }
 boostOrb.y=Math.max(50,Math.min(H-50,boostOrb.y));

 /* столкновение с самолётом */
 const dx=plane.x-boostOrb.x,dy=plane.y-boostOrb.y;
 if(Math.hypot(dx,dy)<boostOrb.r+16){
  collectBoost();
  return;
 }

 if(boostOrb.x<-90)boostOrb=null; // пропустили
}

function collectBoost(){
 score+=10;scoreEl.textContent=score;updateSpeedMultiplier();
 playerBoost.active=true;playerBoost.timer=playerBoost.duration;playerBoost.elapsed=0;
 burst(boostOrb.x,boostOrb.y,"#7cfcff",55);
 boostOrb=null;
}

function updatePlayerBoost(dt){
 if(playerBoost.active){
  playerBoost.timer-=dt;playerBoost.elapsed+=dt;
  if(Math.random()<0.65){
   particles.push({x:plane.x-20,y:plane.y+(Math.random()-.5)*10,vx:-160-Math.random()*120,vy:(Math.random()-.5)*50,life:.4,max:.4,s:1+Math.random()*3,c:"#00eaff"});
  }
  if(playerBoost.timer<=0){
   playerBoost.active=false;playerBoost.timer=0;playerBoost.elapsed=0;
  }
 }
 globalSpeedFX=getBoostFactor();
 boostLvlEl.textContent=playerBoost.active?"×"+globalSpeedFX.toFixed(2):"—";
}

/* ── ресайз ── */
function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

const plane={x:0,y:0,vy:0,rot:0};

function planeBox(){
 return {l:plane.x-17,r:plane.x+17,t:plane.y-8,b:plane.y+8};
}

let drones=[],particles=[];
const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.7,v:.2+Math.random()*.8}));

/* ── сброс игры ── */
function reset(){
 score=0;scoreEl.textContent=0;drones=[];particles=[];time=0;spawn=.9;shake=0;
 plane.x=W*.22;plane.y=H*.5;plane.vy=0;plane.rot=0;
 speedMultiplier=1.0;lastSpeedTier=0;
 speedLvlEl.textContent="×1.00";
 resetBarrel();
 boostOrb=null;
 boostThreshold=randomBoostGap(30);
 playerBoost.active=false;playerBoost.timer=0;playerBoost.elapsed=0;
 globalSpeedFX=1;
 boostLvlEl.textContent="—";
}

/* ── флап + накопление бочки ── */
function flap(){
 if(!playing)return;
 plane.vy=-430;
 for(let i=0;i<5;i++)particles.push({x:plane.x-18,y:plane.y,vx:-80-Math.random()*80,vy:(Math.random()-.5)*70,life:.35,max:.35,s:1+Math.random()*3,c:"#00eaff"});

 if(!barrelRoll.active){
  barrelRoll.clicks++;
  updateBarrelHUD();
  if(barrelRoll.clicks>=barrelRoll.needed){
   activateBarrel();
  }
 }
}

/* ── активация бочки ── */
function activateBarrel(){
 barrelRoll.active=true;
 barrelRoll.timer=barrelRoll.duration;
 barrelRoll.clicks=0;
 barrelRoll.rollSpeed=Math.PI*2*3.5;
 updateBarrelHUD();
}

/* ── дроны ── */
function addDrone(){
 const margin=85;
 const y=margin+Math.random()*(H-margin*2);
 const type=Math.floor(Math.random()*3);
 drones.push({
   x:W+70,y,
   type,
   w:58,h:32,
   hitW:22,hitH:10,
   phase:Math.random()*6.28,
   passed:false
 });
}

function droneBox(d){
 const y=d.y+Math.sin(time*2+d.phase)*14;
 return {l:d.x-d.hitW,r:d.x+d.hitW,t:y-d.hitH,b:y+d.hitH};
}

function hit(a,b){
 return a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;
}

/* ── взрыв ── */
function burst(x,y,color="#ff3f91",n=40){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,life:.4+Math.random()*.7,max:1,s:1+Math.random()*4,c:color});
}

function gameOver(){
 playing=false;shake=13;burst(plane.x,plane.y);
 if(score>best){best=score;localStorage.neonSkyBest=best;bestEl.textContent=best}
 title.textContent="MISSION FAILED";subtitle.textContent=`Счёт: ${score} • Рекорд: ${best}`;
 start.textContent="Повторить ✈️";overlay.classList.remove("hidden");
}

function begin(){
 reset();playing=true;overlay.classList.add("hidden");
}

start.onclick=begin;
addEventListener("pointerdown",e=>{if(overlay.classList.contains("hidden"))flap()},{passive:true});
addEventListener("keydown",e=>{
 if(["Space","ArrowUp","KeyW"].includes(e.code)){
  e.preventDefault();playing?flap():begin();
 }
});

/* ── фон ── */
function background(dt){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#020516");g.addColorStop(.55,"#07142d");g.addColorStop(1,"#02030a");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 for(const s of stars){
  s.x-=dt*.025*s.v*globalSpeedFX;if(s.x<0)s.x=1;
  ctx.globalAlpha=.3+.6*s.v;ctx.fillStyle="#c9fbff";
  ctx.
